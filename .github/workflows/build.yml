name: Build Cosmo Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle-8.7-bin.zip
          sudo unzip -q /tmp/gradle-8.7-bin.zip -d /opt/

      - name: Build Debug APK
        run: /opt/gradle-8.7/bin/gradle assembleDebug --no-daemon

      - name: Upload Cosmo Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CosmoApp-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
